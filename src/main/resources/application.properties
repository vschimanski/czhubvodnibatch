spring.application.name=batch
spring.main.banner-mode=off
spring.batch.job.name=jobScheduledOutput
spring.batch.job.enabled=true

#app.datasource.driver-class-name = org.apache.derby.jdbc.ClientDriver
#app.datasource.jdbc-url=jdbc:derby://localhost:1527/testdb

spring.batch.jdbc.initialize-schema=always

app.datasource.jdbc-url=jdbc:h2:mem:testdb
app.datasource.driverClassName=org.h2.Driver
app.datasource.username=sa
app.datasource.password=
app.jpa.database-platform=org.hibernate.dialect.H2Dialect